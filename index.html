<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>구구단 연습</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c22;
      --text-color: #e1e1e6;
      --sub-text: #8d8d99;
      --btn-bg: #292932;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --active-btn: #4f46e5;
      --correct-color: #10b981;
      --wrong-color: #ef4444;
      --border-color: #2e2e38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh; /* iOS Safari 가변 주소창 최적화 */
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px 16px;
      width: 100%;
      max-width: 360px; /* 규격 축소로 모바일 한 화면에 고정 */
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    /* 단 선택 버튼 (2~9단) */
    .dan-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .dan-btn {
      background-color: var(--btn-bg);
      color: var(--sub-text);
      border: 1px solid var(--border-color);
      padding: 7px 0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .dan-btn.active {
      background-color: var(--active-btn);
      color: #ffffff;
      border-color: var(--active-btn);
    }

    .control-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .mode-btn, .timer-select {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .mode-btn { flex: 1.8; }
    .timer-select { flex: 1.2; }

    .timer-bar-container {
      width: 100%;
      height: 4px;
      background-color: #292932;
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--accent-color);
      transition: width 0.1s linear, background-color 0.3s;
    }

    .stats {
      font-size: 0.8rem;
      color: var(--sub-text);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
    }

    .stats strong { color: #ffffff; }

    .question-box {
      font-size: 2.6rem;
      font-weight: 800;
      margin: 4px 0 14px;
      letter-spacing: 2px;
      color: #ffffff;
    }

    /* 객관식 레이아웃 */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .choice-btn {
      background-color: var(--btn-bg);
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .choice-btn:active { background-color: var(--accent-color); }
    .choice-btn.correct-choice { background-color: var(--correct-color) !important; }
    .choice-btn.wrong-choice { background-color: var(--wrong-color) !important; }

    /* 단답형 레이아웃: 완전 터치식 패드 (input 태그 전면 배제) */
    .short-answer-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      width: 100%;
    }

    .display-screen {
      background-color: #121216;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 4px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .key-btn {
      background-color: var(--btn-bg);
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 11px 0;
      border-radius: 6px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      width: 100%;
    }

    .key-btn:active { background-color: var(--accent-color); }
    .key-btn.action-btn { font-size: 0.95rem; background-color: #383844; }
    .key-btn.enter-btn { background-color: var(--accent-color); font-weight: 700; }

    .feedback {
      height: 18px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .correct { color: var(--correct-color); }
    .wrong { color: var(--wrong-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>구구단 연습</h1>

    <div class="dan-selector" id="dan-container"></div>

    <div class="control-bar">
      <button class="mode-btn" id="mode-btn" onclick="toggleMode()">모드: 객관식</button>
      <select class="timer-select" id="timer-select" onchange="resetTimerSetting()">
        <option value="0">타이머: OFF</option>
        <option value="3">제한: 3초</option>
        <option value="5" selected>제한: 5초</option>
        <option value="7">제한: 7초</option>
        <option value="10">제한: 10초</option>
      </select>
    </div>

    <div class="timer-bar-container" id="timer-bar-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="stats">
      <span>연속 정답: <strong id="streak-count">0</strong>회</span>
      <span>정답률: <strong id="accuracy">100</strong>%</span>
    </div>

    <div class="question-box" id="question">2 × 1</div>

    <!-- 객관식 -->
    <div class="choices-grid" id="multiple-choice-area"></div>

    <!-- 단답형 (키보드 팝업 없는 내장형) -->
    <div class="short-answer-container hidden" id="short-answer-area">
      <div class="display-screen" id="answer-display">?</div>
      
      <div class="keypad-grid">
        <button class="key-btn" type="button" onclick="inputDigit('1')">1</button>
        <button class="key-btn" type="button" onclick="inputDigit('2')">2</button>
        <button class="key-btn" type="button" onclick="inputDigit('3')">3</button>
        <button class="key-btn" type="button" onclick="inputDigit('4')">4</button>
        <button class="key-btn" type="button" onclick="inputDigit('5')">5</button>
        <button class="key-btn" type="button" onclick="inputDigit('6')">6</button>
        <button class="key-btn" type="button" onclick="inputDigit('7')">7</button>
        <button class="key-btn" type="button" onclick="inputDigit('8')">8</button>
        <button class="key-btn" type="button" onclick="inputDigit('9')">9</button>
        <button class="key-btn action-btn" type="button" onclick="clearInput()">지움</button>
        <button class="key-btn" type="button" onclick="inputDigit('0')">0</button>
        <button class="key-btn enter-btn" type="button" onclick="submitShortAnswer()">확인</button>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    let selectedDans = new Set([2]);
    let currentMode = 'multiple';
    let num1 = 2;
    let num2 = 1;
    let correctAnswer = 2;
    let currentInput = '';
    let streak = 0;
    let totalAttempts = 0;
    let correctAttempts = 0;
    let isProcessing = false;

    let timerInterval = null;
    let timeLimit = 5;

    const danContainer = document.getElementById('dan-container');
    const questionEl = document.getElementById('question');
    const multipleArea = document.getElementById('multiple-choice-area');
    const shortArea = document.getElementById('short-answer-area');
    const answerDisplay = document.getElementById('answer-display');
    const feedbackEl = document.getElementById('feedback');
    const modeBtn = document.getElementById('mode-btn');
    const streakEl = document.getElementById('streak-count');
    const accuracyEl = document.getElementById('accuracy');
    const timerSelect = document.getElementById('timer-select');
    const timerBar = document.getElementById('timer-bar');
    const timerBarContainer = document.getElementById('timer-bar-container');

    function initDanButtons() {
      danContainer.innerHTML = '';
      for (let i = 2; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `dan-btn ${selectedDans.has(i) ? 'active' : ''}`;
        btn.textContent = `${i}단`;
        btn.onclick = () => toggleDan(i, btn);
        danContainer.appendChild(btn);
      }
    }

    function toggleDan(dan, btn) {
      if (selectedDans.has(dan)) {
        if (selectedDans.size === 1) {
          alert('최소 1개 이상의 단을 선택해야 합니다.');
          return;
        }
        selectedDans.delete(dan);
        btn.classList.remove('active');
      } else {
        selectedDans.add(dan);
        btn.classList.add('active');
      }
      nextQuestion();
    }

    function toggleMode() {
      currentMode = currentMode === 'multiple' ? 'short' : 'multiple';
      modeBtn.textContent = `모드: ${currentMode === 'multiple' ? '객관식' : '단답형'}`;
      
      if (currentMode === 'multiple') {
        multipleArea.classList.remove('hidden');
        shortArea.classList.add('hidden');
      } else {
        multipleArea.classList.add('hidden');
        shortArea.classList.remove('hidden');
      }
      nextQuestion();
    }

    function resetTimerSetting() {
      timeLimit = parseInt(timerSelect.value, 10);
      if (timeLimit === 0) {
        timerBarContainer.classList.add('hidden');
      } else {
        timerBarContainer.classList.remove('hidden');
      }
      nextQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      if (timeLimit === 0) return;

      timerBar.style.width = '100%';
      timerBar.style.backgroundColor = 'var(--accent-color)';

      const startTime = Date.now();
      const duration = timeLimit * 1000;

      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.max(0, 1 - elapsed / duration);
        timerBar.style.width = `${progress * 100}%`;

        if (progress < 0.25) {
          timerBar.style.backgroundColor = 'var(--wrong-color)';
        }

        if (elapsed >= duration) {
          clearInterval(timerInterval);
          handleAnswer(false, true);
        }
      }, 50);
    }

    function generateQuestion() {
      const danArray = Array.from(selectedDans);
      num1 = danArray[Math.floor(Math.random() * danArray.length)];
      num2 = Math.floor(Math.random() * 9) + 1;
      correctAnswer = num1 * num2;
      questionEl.textContent = `${num1} × ${num2}`;
    }

    function nextQuestion() {
      isProcessing = false;
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      generateQuestion();

      if (currentMode === 'multiple') {
        renderChoices();
      } else {
        clearInput();
      }

      startTimer();
    }

    function renderChoices() {
      multipleArea.innerHTML = '';
      const options = new Set([correctAnswer]);
      let attempts = 0;

      while (options.size < 4 && attempts < 50) {
        attempts++;
        const delta = (Math.floor(Math.random() * 7) - 3) * num1;
        const wrong = correctAnswer + delta;
        if (wrong > 0 && wrong !== correctAnswer) {
          options.add(wrong);
        }
      }

      while (options.size < 4) {
        const rand = Math.floor(Math.random() * 80) + 2;
        if (rand !== correctAnswer) {
          options.add(rand);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (isProcessing) return;
          const isCorrect = (opt === correctAnswer);
          btn.classList.add(isCorrect ? 'correct-choice' : 'wrong-choice');
          handleAnswer(isCorrect);
        };
        multipleArea.appendChild(btn);
      });
    }

    function inputDigit(digit) {
      if (isProcessing) return;
      if (currentInput.length >= 2) return;
      currentInput += digit;
      answerDisplay.textContent = currentInput;

      if (parseInt(currentInput, 10) === correctAnswer) {
        submitShortAnswer();
      }
    }

    function clearInput() {
      currentInput = '';
      answerDisplay.textContent = '?';
    }

    function submitShortAnswer() {
      if (isProcessing || currentInput === '') return;
      const userVal = parseInt(currentInput, 10);
      handleAnswer(userVal === correctAnswer);
    }

    window.addEventListener('keydown', (e) => {
      if (currentMode !== 'short' || isProcessing) return;
      if (e.key >= '0' && e.key <= '9') {
        inputDigit(e.key);
      } else if (e.key === 'Backspace') {
        clearInput();
      } else if (e.key === 'Enter') {
        submitShortAnswer();
      }
    });

    function handleAnswer(isCorrect, isTimeout = false) {
      if (isProcessing) return;
      isProcessing = true;
      clearInterval(timerInterval);
      totalAttempts++;

      if (isCorrect) {
        correctAttempts++;
        streak++;
        feedbackEl.textContent = '정답입니다.';
        feedbackEl.className = 'feedback correct';
        setTimeout(nextQuestion, 350);
      } else {
        streak = 0;
        feedbackEl.textContent = isTimeout ? `시간 초과! (정답: ${correctAnswer})` : `오답입니다. (정답: ${correctAnswer})`;
        feedbackEl.className = 'feedback wrong';
        setTimeout(nextQuestion, 1200);
      }

      streakEl.textContent = streak;
      accuracyEl.textContent = Math.round((correctAttempts / totalAttempts) * 100);
    }

    initDanButtons();
    resetTimerSetting();
  </script>
</body>
</html>
