<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구구단 연습</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c22;
      --text-color: #e1e1e6;
      --sub-text: #8d8d99;
      --btn-bg: #292932;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --active-btn: #4f46e5;
      --correct-color: #10b981;
      --wrong-color: #ef4444;
      --border-color: #2e2e38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .dan-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .dan-btn {
      background-color: var(--btn-bg);
      color: var(--sub-text);
      border: 1px solid var(--border-color);
      padding: 10px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .dan-btn.active {
      background-color: var(--active-btn);
      color: #ffffff;
      border-color: var(--active-btn);
    }

    .control-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode-btn, .timer-select {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .mode-btn { flex: 2; }
    .timer-select { flex: 1.5; }

    .timer-bar-container {
      width: 100%;
      height: 6px;
      background-color: #292932;
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--accent-color);
      transition: width 0.1s linear, background-color 0.3s;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
    }

    .stats strong { color: #ffffff; }

    .question-box {
      font-size: 3.2rem;
      font-weight: 800;
      margin: 10px 0 28px;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .choice-btn {
      background-color: var(--btn-bg);
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 18px;
      border-radius: 12px;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      user-select: none;
      transition: background-color 0.1s ease;
    }

    /* 마우스 호버 지원 기기에서만 호버 효과 적용 (아이폰 터치 후 파란색 고정 방지) */
    @media (hover: hover) and (pointer: fine) {
      .choice-btn:hover {
        background-color: var(--accent-color);
      }
    }

    .choice-btn:active {
      background-color: var(--accent-color);
    }

    .choice-btn.correct-choice {
      background-color: var(--correct-color) !important;
      border-color: var(--correct-color) !important;
    }

    .choice-btn.wrong-choice {
      background-color: var(--wrong-color) !important;
      border-color: var(--wrong-color) !important;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-box input {
      flex: 1;
      background-color: var(--btn-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1.5rem;
      text-align: center;
      padding: 12px;
      outline: none;
    }

    .input-box input:focus {
      border-color: var(--accent-color);
    }

    .submit-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: var(--accent-hover);
    }

    .feedback {
      height: 24px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .correct { color: var(--correct-color); }
    .wrong { color: var(--wrong-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>구구단 연습</h1>

    <div class="dan-selector" id="dan-container"></div>

    <div class="control-bar">
      <button class="mode-btn" id="mode-btn" onclick="toggleMode()">모드: 객관식</button>
      <select class="timer-select" id="timer-select" onchange="resetTimerSetting()">
        <option value="0">타이머: OFF</option>
        <option value="3">제한: 3초</option>
        <option value="5" selected>제한: 5초</option>
        <option value="7">제한: 7초</option>
        <option value="10">제한: 10초</option>
      </select>
    </div>

    <div class="timer-bar-container" id="timer-bar-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="stats">
      <span>연속 정답: <strong id="streak-count">0</strong>회</span>
      <span>정답률: <strong id="accuracy">100</strong>%</span>
    </div>

    <div class="question-box" id="question">2 × 1</div>

    <div class="choices-grid" id="multiple-choice-area"></div>

    <div class="input-box hidden" id="short-answer-area">
      <input type="number" id="answer-input" placeholder="정답 입력" inputmode="numeric" />
      <button class="submit-btn" onclick="checkShortAnswer()">확인</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    let selectedDans = new Set([2]);
    let currentMode = 'multiple';
    let num1 = 2;
    let num2 = 1;
    let correctAnswer = 2;
    let streak = 0;
    let totalAttempts = 0;
    let correctAttempts = 0;
    let isProcessing = false; // 중복 클릭 방지

    let timerInterval = null;
    let timeLimit = 5;

    const danContainer = document.getElementById('dan-container');
    const questionEl = document.getElementById('question');
    const multipleArea = document.getElementById('multiple-choice-area');
    const shortArea = document.getElementById('short-answer-area');
    const answerInput = document.getElementById('answer-input');
    const feedbackEl = document.getElementById('feedback');
    const modeBtn = document.getElementById('mode-btn');
    const streakEl = document.getElementById('streak-count');
    const accuracyEl = document.getElementById('accuracy');
    const timerSelect = document.getElementById('timer-select');
    const timerBar = document.getElementById('timer-bar');
    const timerBarContainer = document.getElementById('timer-bar-container');

    function initDanButtons() {
      danContainer.innerHTML = '';
      for (let i = 2; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = `dan-btn ${selectedDans.has(i) ? 'active' : ''}`;
        btn.textContent = `${i}단`;
        btn.onclick = () => toggleDan(i, btn);
        danContainer.appendChild(btn);
      }
    }

    function toggleDan(dan, btn) {
      if (selectedDans.has(dan)) {
        if (selectedDans.size === 1) {
          alert('최소 1개 이상의 단을 선택해야 합니다.');
          return;
        }
        selectedDans.delete(dan);
        btn.classList.remove('active');
      } else {
        selectedDans.add(dan);
        btn.classList.add('active');
      }
      nextQuestion();
    }

    function toggleMode() {
      currentMode = currentMode === 'multiple' ? 'short' : 'multiple';
      modeBtn.textContent = `모드: ${currentMode === 'multiple' ? '객관식' : '단답형'}`;
      
      if (currentMode === 'multiple') {
        multipleArea.classList.remove('hidden');
        shortArea.classList.add('hidden');
      } else {
        multipleArea.classList.add('hidden');
        shortArea.classList.remove('hidden');
      }
      nextQuestion();
    }

    function resetTimerSetting() {
      timeLimit = parseInt(timerSelect.value, 10);
      if (timeLimit === 0) {
        timerBarContainer.classList.add('hidden');
      } else {
        timerBarContainer.classList.remove('hidden');
      }
      nextQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      if (timeLimit === 0) return;

      timerBar.style.width = '100%';
      timerBar.style.backgroundColor = 'var(--accent-color)';

      const startTime = Date.now();
      const duration = timeLimit * 1000;

      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.max(0, 1 - elapsed / duration);
        timerBar.style.width = `${progress * 100}%`;

        if (progress < 0.25) {
          timerBar.style.backgroundColor = 'var(--wrong-color)';
        }

        if (elapsed >= duration) {
          clearInterval(timerInterval);
          handleAnswer(false, true);
        }
      }, 50);
    }

    function generateQuestion() {
      const danArray = Array.from(selectedDans);
      num1 = danArray[Math.floor(Math.random() * danArray.length)];
      num2 = Math.floor(Math.random() * 9) + 1;
      correctAnswer = num1 * num2;
      questionEl.textContent = `${num1} × ${num2}`;
    }

    function nextQuestion() {
      isProcessing = false;
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      generateQuestion();

      if (currentMode === 'multiple') {
        renderChoices();
      } else {
        answerInput.value = '';
        answerInput.focus();
      }

      startTimer();
    }

    // 오답 번호 생성 알고리즘 개선 (무한 루프 방지)
    function renderChoices() {
      multipleArea.innerHTML = '';
      const options = new Set([correctAnswer]);
      let attempts = 0;

      // 1단계: 유사 배수로 오답 생성 시도
      while (options.size < 4 && attempts < 50) {
        attempts++;
        const delta = (Math.floor(Math.random() * 7) - 3) * num1;
        const wrong = correctAnswer + delta;
        if (wrong > 0 && wrong !== correctAnswer) {
          options.add(wrong);
        }
      }

      // 2단계: 부족할 경우 무작위 1~81 사이 수로 4개 보장
      while (options.size < 4) {
        const rand = Math.floor(Math.random() * 80) + 2;
        if (rand !== correctAnswer) {
          options.add(rand);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = opt;
        btn.onclick = (e) => {
          if (isProcessing) return;
          const isCorrect = (opt === correctAnswer);
          btn.classList.add(isCorrect ? 'correct-choice' : 'wrong-choice');
          handleAnswer(isCorrect);
        };
        multipleArea.appendChild(btn);
      });
    }

    function checkShortAnswer() {
      if (isProcessing) return;
      const userVal = parseInt(answerInput.value, 10);
      if (isNaN(userVal)) return;
      handleAnswer(userVal === correctAnswer);
    }

    answerInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') checkShortAnswer();
    });

    function handleAnswer(isCorrect, isTimeout = false) {
      if (isProcessing) return;
      isProcessing = true;
      clearInterval(timerInterval);
      totalAttempts++;

      if (isCorrect) {
        correctAttempts++;
        streak++;
        feedbackEl.textContent = '정답입니다.';
        feedbackEl.className = 'feedback correct';
        setTimeout(nextQuestion, 350);
      } else {
        streak = 0;
        feedbackEl.textContent = isTimeout ? `시간 초과! (정답: ${correctAnswer})` : `오답입니다. (정답: ${correctAnswer})`;
        feedbackEl.className = 'feedback wrong';
        setTimeout(nextQuestion, 1200);
      }

      streakEl.textContent = streak;
      accuracyEl.textContent = Math.round((correctAttempts / totalAttempts) * 100);
    }

    initDanButtons();
    resetTimerSetting();
  </script>
</body>
</html>
